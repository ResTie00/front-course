<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="padding: 20px; text-align: center;">   
        <h1>Product Page</h1>
    </header>
    <main>
        <section class="product">
            <img src="https://via.placeholder.com/150" alt="Product Image" style="width: 100%; border-radius: 10px;">
            <h2>Product Name</h2>
            <p>This is a brief description of the product. It highlights the key features and benefits.</p>
            <p><strong>Price:</strong> $99.99</p>
            <button class="add-to-cart">Buy</button>
        </section>
</body>
</html>
